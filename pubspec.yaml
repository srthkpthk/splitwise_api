name: splitwise_api
description: >-
  A typed Dart client for the Splitwise API v3.0 with OAuth 2.0 and API-key
  authentication, covering users, groups, friends, expenses and comments.
version: 3.0.0
repository: https://github.com/srthkpthk/splitwise_api
issue_tracker: https://github.com/srthkpthk/splitwise_api/issues
topics:
  - splitwise
  - api-client
  - oauth2
  - expenses

environment:
  sdk: ^3.9.0

dependencies:
  http: ^1.6.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.4.0
  json_serializable: ^6.14.1
  lints: ^6.1.0
  test: ^1.25.0
